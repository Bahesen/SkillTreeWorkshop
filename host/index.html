  ul.cards { list-style: none; margin: 0; padding: 16px 24px 40px; display: grid; gap: 14px; }

<body class="covered">
<header>
  <h1><span id="countLabel">Eingänge:</span> <span id="count">0</span></h1>
  <span id="state">Verbinde …</span>
  <button id="soundTest" type="button">Ton testen</button>
  <button id="restart" type="button">Neu starten</button>
  <button id="action" class="primary" type="button">Aufdecken</button>
</header>

<h2 id="heading">Sätze über die Figuren</h2>
<p class="hint" id="hint" style="display:none">Klicke auf einen Satz, um alle Runden dazu zu sehen.</p>
<div class="empty" id="empty">Noch nichts eingegangen.</div>
<ul class="cards" id="list"></ul>

<script>
  // Muss auf Host- und Client-Seite gleich sein
  const TOPIC = "workshop-78921c3265c600ea";
  const NTFY = "https://ntfy.sh/";
  const $ = (id) => document.getElementById(id);
  const list = $("list"), state = $("state"), actionBtn = $("action");

  // ---- Ablauf ----
  const PHASES = ["collect", "closed", "chain", "chainClosed", "synopsis", "synopsisClosed",
                  "feature", "featureClosed", "final", "finished"];
  // Welche Art von Einsendung in welcher Phase angezeigt wird
  const STAGE = {
    collect: "text", closed: "text", chain: "chain", chainClosed: "chain",
    synopsis: "synopsis", synopsisClosed: "synopsis", feature: "feature", featureClosed: "feature",
    final: "reflection", finished: "overview"
  };
  const COVERED = { collect: true, chain: true, synopsis: true, feature: true, final: true };
  const BUTTON = {
    collect: "Aufdecken", closed: "Nächste Runde", chain: "Aufdecken", chainClosed: "Nächste Runde",
    synopsis: "Aufdecken", synopsisClosed: "Nächste Runde", feature: "Aufdecken", featureClosed: "Letzte Runde",
    final: "Runde beenden", finished: "Ende"
  };
  const HEADING = {
    text: "Sätze über die Figuren", chain: "Assoziationsketten", synopsis: "Synopsen",
    feature: "Gameplay-Features", reflection: "Rückmeldungen", overview: "Vom Ursprung zum Ende"
  };
  const COVER_TEXT = {
    text: "Neue Nachricht", chain: "Neue Assoziationskette", synopsis: "Neue Synopsis",
    feature: "Neues Gameplay-Feature", reflection: "Neue Rückmeldung"
  };

  // ---- Zustand ----
  let phase = "collect";
  let session = null;      // ID der aktuellen Runde
  let sessionStart = 0;    // Unix-Sekunden: ältere Nachrichten werden ignoriert
  let shownStage = null;
  const raw = [];          // alle empfangenen Nachrichten
  const rawIds = new Set();
  let shown = new Set();
  let counter = 0;

  const timeOf = (sec) => new Date(sec * 1000).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const lastOf = (arr) => (arr && arr.length ? arr[arr.length - 1] : "");

  function parse(msg) {
    let data;
    try { data = JSON.parse(msg.message); } catch (e) {}
    if (!data || typeof data !== "object") data = { type: "text", from: null, text: msg.message };
    if (!data.type) data.type = "text";
    return data;
  }

  // Gehört die Nachricht zur aktuellen Runde und zu dieser Art?
  function belongs(msg, data, type) {
    if (msg.time < sessionStart || data.type !== type) return false;
    if (type === "text") return typeof data.text === "string";
    return !!session && data.session === session;
  }

  // Alle Einsendungen einer Art in der aktuellen Runde (älteste zuerst)
  function entries(type) {
    return raw.slice().sort((a, b) => a.time - b.time)
      .map(m => ({ msg: m, data: parse(m) })).filter(e => belongs(e.msg, e.data, type))
      .map(e => Object.assign({ origin: e.msg.id }, e.data, e.data.type === "text" ? { origin: e.msg.id } : {}));
  }

  // Einsendung einer Art zu einem Ursprungssatz finden
  const byOrigin = (type, origin) => entries(type).find(d => d.origin === origin);

  function chainRow(start, end, small) {
    const row = el("div", "chain" + (small ? " small" : ""));
    row.append(el("span", "", start), el("span", "arrow", "→"), el("span", "", end));
    return row;
  }

  // ---- Darstellung ----
  function addEntry(msg, data) {
    counter++;
    const li = el("li");
    li.append(el("div", "meta", "#" + counter + " · " + timeOf(msg.time)));
    if (COVER_TEXT[data.type]) li.appendChild(el("div", "cover", COVER_TEXT[data.type]));
    const content = el("div", "content");

    if (shownStage === "overview") {
      content.append(el("div", "text", data.text), el("div", "more", "Alle Runden ansehen"));
      const details = el("div", "details");
      li.classList.add("clickable");
      li.addEventListener("click", () => {
        if (!li.classList.contains("open")) fillDetails(details, msg.id);
        li.classList.toggle("open");
      });
      content.appendChild(details);
    } else if (data.type === "text") {
      content.appendChild(el("div", "text", data.text));
    } else if (data.type === "chain") {
      content.appendChild(chainRow(data.start, lastOf(data.items)));
    } else if (data.type === "synopsis") {
      content.append(chainRow(data.start, data.end, true), el("div", "text", data.text));
    } else if (data.type === "feature") {
      content.append(el("div", "small clamp", data.synopsis || ""), el("div", "text", data.text));
    } else if (data.type === "reflection") {
      content.appendChild(el("div", "text", data.text));
    }

    li.appendChild(content);
    list.prepend(li); // neueste oben
  }

  function fillDetails(box, origin) {
    const chain = byOrigin("chain", origin);
    const syn = byOrigin("synopsis", origin);
    const feat = byOrigin("feature", origin);
    const refl = byOrigin("reflection", origin);
    box.innerHTML = "";
    const add = (label, value) => box.append(el("div", "label", label), el("div", "val", value || "–"));
    add("Assoziationskette", chain ? [chain.start, ...(chain.items || [])].join("  →  ") : "");
    add("Synopsis", syn && syn.text);
    add("Gameplay-Feature", feat && feat.text);
    add("Rückmeldung", refl && refl.text);
  }

  function consider(msg) {
    if (shown.has(msg.id)) return;
    const data = parse(msg);
    const type = shownStage === "overview" ? "text" : shownStage;
    if (!belongs(msg, data, type)) return;
    shown.add(msg.id);
    addEntry(msg, data);
    updateCounts();
  }

  function rebuild() {
    rebuilding = true;
    list.innerHTML = "";
    shown = new Set();
    counter = 0;
    shownStage = STAGE[phase];
    raw.slice().sort((a, b) => a.time - b.time).forEach(consider);
    rebuilding = false;
    updateCounts();
  }

  // Ton, wenn in einer Arbeitsrunde alle abgegeben haben

  let audioCtx = null, soundBuffer = null;
  const fallbackAudio = new Audio("data:audio/mpeg;base64," + SOUND_B64);

  function unlockAudio() {
    try {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
        const bytes = Uint8Array.from(atob(SOUND_B64), c => c.charCodeAt(0));

    try {
      if (audioCtx && soundBuffer && audioCtx.state === "running") {

        src.buffer = soundBuffer;
        src.connect(audioCtx.destination);
        src.start();
        return;
      }
    } catch (e) {}
    try { fallbackAudio.currentTime = 0; const p = fallbackAudio.play(); if (p) p.catch(() => {}); } catch (e) {}
  }

    setTimeout(playDone, soundBuffer ? 0 : 300);
  });

  let soundPlayedFor = null;
  let rebuilding = false;

  function updateCounts() {
    $("empty").style.display = list.children.length ? "none" : "block";

    // Ab Runde 2: Abgaben im Verhältnis zu den Teilnehmenden aus Runde 1
    if (COVERED[phase] && phase !== "collect") {
      const total = new Set(entries("text").map(t => t.from).filter(Boolean)).size;
      const done = new Set(entries(STAGE[phase]).map(d => d.from).filter(Boolean)).size;
      $("countLabel").textContent = "Abgegeben:";
      $("count").textContent = done + " / " + total;

      const key = session + "|" + phase;
      if (total > 0 && done >= total && soundPlayedFor !== key) {
        soundPlayedFor = key;
        if (!rebuilding) {
          playDone();
        }
      }
    } else {
      $("countLabel").textContent = "Eingänge:";
      $("count").textContent = list.children.length;
    }
  }

  function renderPhase() {
    document.body.classList.toggle("covered", !!COVERED[phase]);
    $("heading").textContent = HEADING[STAGE[phase]];
    $("hint").style.display = phase === "finished" ? "block" : "none";
    actionBtn.disabled = phase === "finished";
    actionBtn.textContent = BUTTON[phase];
  }

  function applyCtrl(data) {
    const changed = data.session !== session || (data.start || 0) !== sessionStart || STAGE[data.phase] !== shownStage;
    phase = data.phase;
    session = data.session;
    sessionStart = data.start || 0;
    renderPhase();
    if (changed) rebuild();
    else updateCounts();
  }

  // ---- Senden ----
  async function post(topic, obj) {
    const res = await fetch(NTFY + topic, { method: "POST", body: JSON.stringify(obj) });
    if (!res.ok) throw new Error(res.status);
  }

  async function setPhase(newPhase) {
    const data = { phase: newPhase, session, start: sessionStart };
    await post(TOPIC + "-ctrl", data);
    applyCtrl(data);
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Verteilt items an clients: keine Zuteilung doppelt, und niemand bekommt etwas,
  // an dem er schon mitgeschrieben hat (item.block). Klappt das nicht für alle,
  // wird nur noch der direkte Absender (item.from) ausgeschlossen, danach gibt es einen Notfall-Plan.
  function distribute(items, clientIds) {
    const clients = shuffle(clientIds);
    if (!clients.length || !items.length) return {};
    if (items.length === 1) return Object.fromEntries(clients.map(c => [c, items[0]]));
    const pool = shuffle(items.map((_, i) => i));

    function match(blocked) {
      const owner = new Array(items.length).fill(null); // Eintrag -> Client
      const matchOf = {};                                // Client -> Eintrag
      function tryClient(c, visited) {
        for (const i of pool) {
          if (blocked(i, c) || visited.has(i)) continue;
          visited.add(i);
          if (owner[i] === null || tryClient(owner[i], visited)) {
            owner[i] = c;
            matchOf[c] = i;
            return true;
          }
        }
        return false;
      }
      clients.forEach(c => tryClient(c, new Set()));
      return { owner, matchOf };
    }

    const complete = (m) => clients.every(c => m.matchOf[c] !== undefined);
    let m = match((i, c) => (items[i].block || [items[i].from]).includes(c));
    if (!complete(m)) m = match((i, c) => items[i].from === c);

    // Notfall: erst freie fremde, dann freie eigene, dann beliebige fremde Einträge
    const { owner, matchOf } = m;
    clients.forEach(c => {
      if (matchOf[c] !== undefined) return;
      let i = pool.find(i => owner[i] === null && items[i].from !== c);
      if (i === undefined) i = pool.find(i => owner[i] === null);
      if (i === undefined) i = pool.find(i => items[i].from !== c);
      if (i === undefined) i = pool[0];
      if (owner[i] === null) owner[i] = c;
      matchOf[c] = i;
    });

    return Object.fromEntries(clients.map(c => [c, items[matchOf[c]]]));
  }

  // Alle, die an einem Ursprungssatz bisher mitgeschrieben haben
  function lineage(origin) {
    return ["text", "chain", "synopsis"].map(t => byOrigin(t, origin)).filter(Boolean).map(d => d.from);
  }
  const withBlock = (items) => items.map(d => Object.assign({}, d, { block: [d.from, ...lineage(d.origin)] }));

  // Alle, die bisher irgendetwas eingereicht haben
  function participants() {
    const ids = ["text", "chain", "synopsis", "feature"].flatMap(t => entries(t).map(d => d.from));
    return [...new Set(ids.filter(Boolean))];
  }

  async function sendAssignments(stage, assignments, toPayload) {
    await Promise.all(Object.entries(assignments).map(([clientId, item]) =>
      post(TOPIC + "-c-" + clientId, Object.assign({ type: "assign", stage, session }, toPayload(item)))));
  }

  // ---- Buttons ----
  actionBtn.addEventListener("click", async () => {
    actionBtn.disabled = true;
    try {
      if (!session) session = String(Date.now());

      if (COVERED[phase] && phase !== "final") {
        // Aufdecken
        await setPhase(PHASES[PHASES.indexOf(phase) + 1]);

      } else if (phase === "closed") {
        const texts = entries("text");
        await sendAssignments("chain", distribute(texts, [...new Set(texts.map(t => t.from).filter(Boolean))]),
          t => ({ origin: t.origin, text: t.text }));
        await setPhase("chain");

      } else if (phase === "chainClosed") {
        await sendAssignments("synopsis", distribute(withBlock(entries("chain")), participants()),
          c => ({ origin: c.origin, start: c.start, end: lastOf(c.items) }));
        await setPhase("synopsis");

      } else if (phase === "synopsisClosed") {
        await sendAssignments("feature", distribute(withBlock(entries("synopsis")), participants()),
          s => ({ origin: s.origin, synopsis: s.text }));
        await setPhase("feature");

      } else if (phase === "featureClosed") {
        // Jede Person bekommt den Weg ihres eigenen Satzes zurück
        const results = {};
        entries("text").forEach(t => {
          if (!t.from || results[t.from]) return;
          const chain = byOrigin("chain", t.origin);
          const syn = byOrigin("synopsis", t.origin);
          const feat = byOrigin("feature", t.origin);
          results[t.from] = {
            origin: t.origin, text: t.text,
            items: chain ? chain.items || [] : [],
            synopsis: syn ? syn.text : "",
            feature: feat ? feat.text : ""
          };
        });
        await sendAssignments("final", results, r => r);
        await setPhase("final");

      } else if (phase === "final") {
        await setPhase("finished");
      }
    } catch (err) {
      actionBtn.textContent = "Fehler – nochmal versuchen";
      setTimeout(renderPhase, 2000);
    } finally {
      actionBtn.disabled = phase === "finished";
    }
  });

  let confirmRestart = false;
  $("restart").addEventListener("click", async () => {
    if (!confirmRestart) {
      confirmRestart = true;
      $("restart").textContent = "Wirklich? Nochmal klicken";
      setTimeout(() => { confirmRestart = false; $("restart").textContent = "Neu starten"; }, 3000);
      return;
    }
    confirmRestart = false;
    $("restart").textContent = "Neu starten";
    try {
      const data = { phase: "collect", session: String(Date.now()), start: Math.floor(Date.now() / 1000) };
      await post(TOPIC + "-ctrl", data);
      applyCtrl(data);
    } catch (err) {
      $("restart").textContent = "Fehler – nochmal";
      setTimeout(() => ($("restart").textContent = "Neu starten"), 2000);
    }
  });

  // ---- Live-Verbindungen ----
  const ctrlSeen = new Set();
  const ctrl = new EventSource(NTFY + TOPIC + "-ctrl/sse?since=all");
  ctrl.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.event !== "message" || ctrlSeen.has(msg.id)) return; // bei Neuverbindung nichts doppelt abspielen
      ctrlSeen.add(msg.id);
      const data = JSON.parse(msg.message);
      if (PHASES.includes(data.phase)) applyCtrl(data);
    } catch (err) {}
  };

  const main = new EventSource(NTFY + TOPIC + "/sse?since=all");
  main.onopen = () => { state.textContent = "Live"; state.className = "live"; };
  main.onerror = () => { state.textContent = "Verbindung unterbrochen – verbinde neu …"; state.className = ""; };
  main.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.event !== "message" || rawIds.has(msg.id)) return;
      rawIds.add(msg.id);
      raw.push(msg);
      consider(msg);
    } catch (err) {}
  };

  renderPhase();
  rebuild();
</script>
</body>
</html>
